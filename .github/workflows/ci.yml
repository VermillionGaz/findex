# Runs on every push and pull request: lint, format check, type check, tests.
# On both Linux and Windows, because the author develops on Windows.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false            # let both OSes finish, so you see every failure
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check src tests

      - name: Formatting (ruff format --check)
        run: uv run ruff format --check src tests

      - name: Types (pyright strict)
        run: uv run pyright

      - name: Tests, with coverage
        run: uv run pytest --cov=findex --cov-report=term-missing
