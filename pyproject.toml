[project]
name = "findex"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gaz", email = "anton.yaremich@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
data = [
    "datasets>=5.2.0",
]
dev = [
    "hypothesis>=6.170",
    "pyarrow>=26.0.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.0",
    "ruff>=0.17.6",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "slow: takes over a second (Hypothesis properties, subprocess end-to-end); skip with -m 'not slow'",
]

[tool.coverage.run]
source = ["findex"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "raise NotImplementedError",     # abstract methods: subclasses must override them
    'if __name__ == "__main__":',
]
