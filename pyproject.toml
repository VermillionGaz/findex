[project]
name = "findex"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gaz", email = "anton.yaremich@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
data = [
    "datasets>=5.2.0",
]
dev = [
    "pyarrow>=26.0.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
