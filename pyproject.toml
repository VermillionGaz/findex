[project]
name = "findex"
version = "0.4.0"
description = "A small full-text search engine: inverted index, BM25 ranking, a Boolean query language."
readme = "README.md"
authors = [
    { name = "Gaz", email = "anton.yaremich@gmail.com" }
]
requires-python = ">=3.13"
keywords = ["search", "inverted-index", "bm25", "full-text-search"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "rich>=13.7",
    "typer>=0.15",
]

[project.urls]
Repository = "https://github.com/VermillionGaz/findex"

[project.scripts]
# `findex` on the command line runs the typer app object in findex/cli.py
findex = "findex.cli:app"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
bench = [
    "matplotlib>=3.9",
    "psutil>=6.0",
]
data = [
    "datasets>=5.2.0",
]
dev = [
    "hypothesis>=6.170",
    "pyarrow>=26.0.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.0",
    "ruff>=0.17.6",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "slow: takes over a second (Hypothesis properties, subprocess end-to-end); skip with -m 'not slow'",
]

[tool.coverage.run]
source = ["findex"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "raise NotImplementedError",     # abstract methods: subclasses must override them
    'if __name__ == "__main__":',
]
omit = ["*/findex/__main__.py"]      # two lines that only forward to cli.app
